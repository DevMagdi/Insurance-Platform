# Default values. Production overrides live in values-production.yaml.
# Secrets are NEVER put here: reference an existing Secret (External Secrets,
# Sealed Secrets, Vault CSI...) through `secrets.existingSecret`.

image:
  registry: ghcr.io
  owner: devmagdi
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  api: insurance-platform-api
  web: insurance-platform-web
imagePullSecrets: []

publicUrl: https://complaints.example.com

secrets:
  # Must contain: APP_ENCRYPTION_KEY, APP_BLIND_INDEX_KEY, JWT_SIGNING_KEY,
  # APP_DB_PASSWORD, APP_WORKER_DB_PASSWORD, TURNSTILE_SITE_KEY,
  # TURNSTILE_SECRET_KEY, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
  # DATABASE_ADMIN_URL (migration hook only), optional METRICS_TOKEN,
  # SENTRY_DSN, SMTP_USERNAME, SMTP_PASSWORD, APP_ENCRYPTION_PREVIOUS_KEYS,
  # APP_IDEMPOTENCY_KEY.
  existingSecret: insurance-platform-secrets

database:
  host: postgres-primary.database.svc
  port: 5432
  name: insurance
  # Optional streaming replica for scoped analytics reads (RLS applies there too).
  readHost: ""
  # Appended to runtime URLs, e.g. "?ssl=require" for TLS to a managed database.
  urlQuery: ""

redis:
  url: redis://redis-master.cache.svc:6379/0

objectStorage:
  bucket: complaint-attachments
  endpointUrl: ""     # empty = AWS S3
  region: eu-central-1

smtp:
  host: smtp.example.com
  port: 587
  from: no-reply@example.com
  startTls: true

config:
  ENVIRONMENT: production
  COOKIE_SECURE: "true"
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  # The ingress controller / LB pod network; only these peers may set X-Forwarded-For.
  TRUSTED_PROXY_CIDRS: 10.0.0.0/8
  CORS_ALLOWED_ORIGINS: ""
  RATE_LIMIT_MULTIPLIER: "1"
  QUEUE_BACKPRESSURE_THRESHOLD: "5000"
  SENTRY_TRACES_SAMPLE_RATE: "0.05"
  APP_ENCRYPTION_KEY_ID: "1"

api:
  serviceName: api      # the web image's nginx proxies to http://api:8000
  replicas: 3
  webConcurrency: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 60
    targetCPU: 65
    targetMemory: 75
  pdb:
    minAvailable: 2
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 10

worker:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {cpu: "1", memory: 768Mi}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPU: 70
  pdb:
    minAvailable: 1
  terminationGracePeriodSeconds: 90
  metricsPort: 9100

web:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPU: 70
  pdb:
    minAvailable: 1

pgbouncer:
  enabled: true
  image: edoburu/pgbouncer:v1.24.1-p1
  replicas: 2
  poolMode: transaction
  maxClientConn: 5000
  defaultPoolSize: 40
  maxPreparedStatements: 200
  resources:
    requests: {cpu: 200m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}

migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 900

partitions:
  enabled: true
  schedule: "17 2 * * *"

ingress:
  enabled: true
  className: nginx
  host: complaints.example.com
  tlsSecret: complaints-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "50"

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
  grafanaDashboard:
    enabled: false   # ConfigMap picked up by the Grafana sidecar (label grafana_dashboard=1)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
