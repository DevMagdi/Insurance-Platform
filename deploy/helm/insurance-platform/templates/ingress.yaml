{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ip.fullname" . }}
  labels: {{- include "ip.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API traffic bypasses the static edge; /metrics is never routed publicly.
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ .Values.api.serviceName }}, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "ip.fullname" . }}-web, port: {number: 80}}
{{- end }}
