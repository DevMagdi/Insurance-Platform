apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ip.fullname" . }}-api
  labels: {{- include "ip.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}   # zero-downtime rollouts
  selector:
    matchLabels: {{- include "ip.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ip.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ip.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "ip.selector" (dict "root" . "component" "api") | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "ip.selector" (dict "root" . "component" "api") | nindent 14 }}
      containers:
        - name: api
          image: {{ include "ip.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["gunicorn", "-c", "gunicorn.conf.py", "app.main:app"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: {{ include "ip.fullname" . }}-config}
          env:
            - name: WEB_CONCURRENCY
              value: {{ .Values.api.webConcurrency | quote }}
            {{- include "ip.apiEnv" . | nindent 12 }}
          startupProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # 503 while draining or when PostgreSQL/Redis are unreachable.
            httpGet: {path: /api/health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Let endpoints/ingress drop the pod before SIGTERM starts the drain.
              exec: {command: ["sleep", "{{ .Values.api.preStopSleepSeconds }}"]}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.serviceName }}
  labels: {{- include "ip.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "ip.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
