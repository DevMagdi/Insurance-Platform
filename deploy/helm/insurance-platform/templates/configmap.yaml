apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ip.fullname" . }}-config
  labels: {{- include "ip.labels" . | nindent 4 }}
data:
  PUBLIC_APP_URL: {{ .Values.publicUrl | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_FROM: {{ .Values.smtp.from | quote }}
  SMTP_START_TLS: {{ .Values.smtp.startTls | quote }}
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
