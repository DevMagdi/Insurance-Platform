apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ip.fullname" . }}-worker
  labels: {{- include "ip.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {{- include "ip.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ip.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ip.fullname" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # arq finishes in-flight jobs on SIGTERM; durable outbox rows make retries safe.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "ip.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["arq", "app.worker.WorkerSettings"]
          ports:
            - {name: metrics, containerPort: {{ .Values.worker.metricsPort }}}
          envFrom:
            - configMapRef: {name: {{ include "ip.fullname" . }}-config}
          env:
            {{- range $name := list "APP_WORKER_DB_PASSWORD" "APP_ENCRYPTION_KEY" "S3_ACCESS_KEY_ID" "S3_SECRET_ACCESS_KEY" }}
            {{- include "ip.secretEnv" (dict "root" $ "name" $name) | nindent 12 }}
            {{- end }}
            {{- range $name := list "SENTRY_DSN" "SMTP_USERNAME" "SMTP_PASSWORD" "APP_ENCRYPTION_PREVIOUS_KEYS" "APP_IDEMPOTENCY_KEY" }}
            {{- include "ip.secretEnv" (dict "root" $ "name" $name "optional" true) | nindent 12 }}
            {{- end }}
            # The worker connects directly (session-level advisory locks, LISTEN).
            - name: WORKER_DATABASE_URL
              value: "postgresql+asyncpg://app_worker:$(APP_WORKER_DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}{{ .Values.database.urlQuery }}"
            - name: WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | quote }}
            - name: APP_RELEASE
              value: {{ include "ip.tag" . | quote }}
          livenessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ip.fullname" . }}-worker-metrics
  labels: {{- include "ip.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  selector: {{- include "ip.selector" (dict "root" . "component" "worker") | nindent 4 }}
  ports:
    - {name: metrics, port: {{ .Values.worker.metricsPort }}, targetPort: metrics}
