[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-platform-backend"
version = "0.1.0"
description = "Insurance brokerage complaint management API and schema"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "argon2-cffi>=23,<27",
  "filetype>=1.2,<2",
  "PyJWT>=2.9,<3",
  "pyotp>=2.9,<3",
  "aiosmtplib>=3.0,<6",
  "asyncpg>=0.30,<1",
  "cryptography>=50.0.2,<52",
  "fastapi>=0.115,<1",
  "gunicorn>=23,<27",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<7",
  "sentry-sdk[fastapi]>=2.20,<3",
  "SQLAlchemy[asyncio]>=2.0.36,<2.1",
  "sqlparse>=0.5,<1",
  "uvicorn[standard]>=0.32,<1",
  "uvicorn-worker>=0.3,<1",
]

[project.optional-dependencies]
loadtest = ["locust>=2.30,<3"]
seed = ["argon2-cffi>=23,<27", "Faker>=33,<40"]
dev = [
  "argon2-cffi>=23,<27",
  "Faker>=33,<40",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "openapi-spec-validator>=0.7,<1",
  "pre-commit>=4,<5",
  "fakeredis[lua]>=2.30,<3",
  "pip-audit>=2.7,<3",
  "pytest-cov>=6,<8",
  "testcontainers[postgres,redis]>=4.10,<5",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-timeout>=2.3,<3",
  "PyYAML>=6,<7",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL database and an app_runtime role", "testcontainers: starts disposable PostgreSQL/Redis containers"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"] # assertions are appropriate in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "RUF012"]
"app/api/*" = ["B008"] # FastAPI Depends/Query are dependency declarations.
"app/api/deps.py" = ["B008", "S104"] # 0.0.0.0 is an unknown-IP sentinel.
"app/services/email_templates.py" = ["RUF001"] # Arabic literals are intentional localized copy.
"app/services/integration_providers.py" = ["RUF001"] # Arabic mock dialogue exercises bilingual flows.
"app/services/integrations.py" = ["RUF001"] # Arabic call scripts are intentional.
"alembic/versions/*" = ["S"]
"app/scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
