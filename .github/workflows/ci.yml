name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e './backend[dev,seed]'
      - run: python -m ruff check backend scripts && python -m ruff format --check backend scripts
      - run: cd backend && python -m mypy app && python -m pytest -m 'not integration' --cov=app --cov-report=term-missing --cov-fail-under=80
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run lint && npm run typecheck && npm run test && npm run build
      - name: Playwright e2e (API mocked at the network layer)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e -- --reporter=github
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable images
        run: |
          docker build -f infra/Dockerfile.backend -t ci-api .
          docker build -f infra/Dockerfile.web -t ci-web .
      - name: Boot the images together and check the same-origin contract
        run: |
          set -euo pipefail
          docker network create ci-smoke
          python - <<'PY' > /tmp/smoke.env
          import base64, secrets
          print("APP_ENCRYPTION_KEY=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
          print("APP_BLIND_INDEX_KEY=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
          print("JWT_SIGNING_KEY=" + secrets.token_urlsafe(48))
          PY
          docker run -d --name ci-api --network ci-smoke --network-alias api \
            --env-file /tmp/smoke.env -e ENVIRONMENT=production -e COOKIE_SECURE=true \
            -e DATABASE_URL=postgresql+asyncpg://app_runtime:unused@postgres:5432/insurance \
            -e REDIS_URL=redis://redis:6379/0 ci-api
          docker run -d --name ci-web --network ci-smoke -p 18080:80 ci-web
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health/live >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/api/health/live
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<div id="root"'
      - name: Fail if the image contract drifted from docs/openapi.yaml
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import json, yaml
          json.dump(yaml.safe_load(open('docs/openapi.yaml')), open('/tmp/contract.json', 'w'))
          PY
          docker run --rm --network ci-smoke --env-file /tmp/smoke.env \
            -e ENVIRONMENT=production -e COOKIE_SECURE=true \
            -e DATABASE_URL=postgresql+asyncpg://app_runtime:unused@postgres:5432/insurance \
            -e REDIS_URL=redis://redis:6379/0 -v /tmp/contract.json:/tmp/contract.json:ro ci-api \
            python -c "import json; from app.main import app; actual = app.openapi(); expected = json.load(open('/tmp/contract.json')); assert actual == expected, 'image does not match docs/openapi.yaml'; print('image matches contract', len(actual['paths']), 'paths')"
      - if: always()
        run: |
          docker logs ci-api || true
          docker rm -f ci-api ci-web || true
          docker network rm ci-smoke || true
      - name: Prove the production compose file renders
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prod.env
          import base64, secrets
          values = {
              "POSTGRES_DB": "insurance", "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": secrets.token_urlsafe(24),
              "APP_DB_PASSWORD": secrets.token_urlsafe(24),
              "APP_WORKER_DB_PASSWORD": secrets.token_urlsafe(24),
              "MINIO_ROOT_USER": "minio-" + secrets.token_hex(6),
              "MINIO_ROOT_PASSWORD": secrets.token_urlsafe(24),
              "S3_BUCKET": "complaint-attachments",
              "APP_ENCRYPTION_KEY": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              "APP_BLIND_INDEX_KEY": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              "JWT_SIGNING_KEY": secrets.token_urlsafe(48),
              "SMTP_HOST": "smtp.example.invalid", "SMTP_FROM": "no-reply@example.invalid",
              "PUBLIC_APP_URL": "https://app.example.invalid",
              "IMAGE_OWNER": "ci-owner", "IMAGE_TAG": "ci",
          }
          for name, value in values.items():
              print(f"{name}={value}")
          PY
          docker compose --env-file /tmp/prod.env -f docker-compose.prod.yml config --quiet
  postgres-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e './backend[dev,seed]'
      - name: Generate ephemeral CI secrets and start PostgreSQL + transaction pooler
        run: |
          python scripts/bootstrap_env.py
          python - <<'PY'
          import secrets
          from pathlib import Path
          path = Path('.env')
          text = path.read_text()
          text = text.replace('DEMO_STAFF_PASSWORD=', 'DEMO_STAFF_PASSWORD=' + secrets.token_urlsafe(24))
          path.write_text(text)
          PY
          docker compose config --quiet
          docker compose up -d --wait postgres pgbouncer redis
      - name: Apply the real PostgreSQL migrations
        run: docker compose run --rm migrate
      - name: Prove RLS through direct PostgreSQL AND PgBouncer transaction pooling
        run: |
          set -a
          . ./.env
          set +a
          export TEST_DATABASE_ADMIN_URL="postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export TEST_DIRECT_DATABASE_URL="postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export TEST_PGBOUNCER_DATABASE_URL="postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@127.0.0.1:6432/${POSTGRES_DB}"
          cd backend
          set +e
          python -m pytest -m integration -v > /tmp/insurance-integration.log 2>&1
          code=$?
          set -e
          cat /tmp/insurance-integration.log
          if [ "$code" -ne 0 ]; then
            # Surface concise failure lines in check-run annotations even when
            # GitHub's separate log-archive host is unreachable to reviewers.
            python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/insurance-integration.log').read_text(errors='replace').splitlines()
          summary = [line for line in lines if line.startswith(('FAILED ', 'ERROR '))]
          errors = [line for line in lines if line.startswith('E   ')]
          import re
          # The log archive is not always reachable from restricted networks.
          # Emit traceback excerpts FIRST (Actions can cap step annotations).
          parts = re.split(r'(?m)^_{3,} (test_.*) _{3,}$', '\n'.join(lines))
          for name, trace in list(zip(parts[1::2], parts[2::2]))[:8]:
              tail = trace[-2200:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Trace {name[:70]}::{tail}')
          for line in (summary + errors)[:4]:
              escaped = line[:1200].replace('%', '%25').replace('\r', '%0D')
              print(f'::error title=PostgreSQL integration failure::{escaped}')
          PY
          fi
          exit "$code"
      - name: Seed 5,000 synthetic tickets (twice to check idempotence)
        run: |
          docker compose run --rm seed
          docker compose run --rm seed
          set -a
          . ./.env
          set +a
          python - <<'PY'
          import os
          import psycopg
          url = f"postgresql://postgres:{os.environ['POSTGRES_PASSWORD']}@127.0.0.1:5432/{os.environ['POSTGRES_DB']}"
          with psycopg.connect(url) as conn:
              assert conn.execute('SELECT count(*) FROM complaints').fetchone()[0] == 5000
              assert conn.execute('SELECT count(*) FROM permissions').fetchone()[0] >= 34
          PY
      - if: always()
        run: docker compose down -v
