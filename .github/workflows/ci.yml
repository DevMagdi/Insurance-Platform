name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e './backend[dev,seed]'
      - run: python -m ruff check backend scripts loadtest && python -m ruff format --check backend scripts loadtest
      - name: Zero-downtime migration lint (expand/contract rules)
        run: cd backend && python -m app.scripts.lint_migrations
      - run: cd backend && python -m mypy app && python -m pytest -m 'not integration' --cov=app --cov-report=term-missing --cov-fail-under=80
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run lint && npm run typecheck && npm run test && npm run build
      - name: Playwright e2e (API mocked at the network layer)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e -- --reporter=github
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable images
        run: |
          docker build -f infra/Dockerfile.backend -t ci-api .
          docker build -f infra/Dockerfile.web -t ci-web .
      - name: Validate the production Nginx configuration inside the image
        run: scripts/ci/annotate.sh "nginx -t" docker run --rm --add-host api:127.0.0.1 ci-web nginx -t
      - name: Install Trivy (pinned release, checksum verified)
        run: |
          set -euo pipefail
          V=0.75.0
          cd /tmp
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_checksums.txt"
          grep " trivy_${V}_Linux-64bit.tar.gz$" "trivy_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${V}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan the images (fail on fixable CRITICAL, report HIGH)
        run: |
          set -euo pipefail
          for image in ci-api ci-web; do
            scripts/ci/annotate.sh "Trivy report" trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$image"
            scripts/ci/annotate.sh "Trivy CRITICAL in $image" \
              trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Boot the images together and check the same-origin contract
        run: |
          set -euo pipefail
          docker network create ci-smoke
          python - <<'PY' > /tmp/smoke.env
          import base64, secrets
          print("APP_ENCRYPTION_KEY=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
          print("APP_BLIND_INDEX_KEY=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
          print("JWT_SIGNING_KEY=" + secrets.token_urlsafe(48))
          # Cloudflare's documented always-pass test keys: production refuses to boot without CAPTCHA.
          print("TURNSTILE_SITE_KEY=1x00000000000000000000AA")
          print("TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA")
          PY
          docker run -d --name ci-api --network ci-smoke --network-alias api \
            --env-file /tmp/smoke.env -e ENVIRONMENT=production -e COOKIE_SECURE=true \
            -e DATABASE_URL=postgresql+asyncpg://app_runtime:unused@postgres:5432/insurance \
            -e REDIS_URL=redis://redis:6379/0 ci-api
          docker run -d --name ci-web --network ci-smoke -p 18080:80 ci-web
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health/live >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/api/health/live
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<div id="root"'
      - name: Fail if the image contract drifted from docs/openapi.yaml
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import json, yaml
          json.dump(yaml.safe_load(open('docs/openapi.yaml')), open('/tmp/contract.json', 'w'))
          PY
          docker run --rm --network ci-smoke --env-file /tmp/smoke.env \
            -e ENVIRONMENT=production -e COOKIE_SECURE=true \
            -e DATABASE_URL=postgresql+asyncpg://app_runtime:unused@postgres:5432/insurance \
            -e REDIS_URL=redis://redis:6379/0 -v /tmp/contract.json:/tmp/contract.json:ro ci-api \
            python -c "import json; from app.main import app; actual = app.openapi(); expected = json.load(open('/tmp/contract.json')); assert actual == expected, 'image does not match docs/openapi.yaml'; print('image matches contract', len(actual['paths']), 'paths')"
      - if: always()
        run: |
          docker logs ci-api || true
          docker rm -f ci-api ci-web || true
          docker network rm ci-smoke || true
      - name: Prove the production compose file renders
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prod.env
          import base64, secrets
          values = {
              "POSTGRES_DB": "insurance", "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": secrets.token_urlsafe(24),
              "APP_DB_PASSWORD": secrets.token_urlsafe(24),
              "APP_WORKER_DB_PASSWORD": secrets.token_urlsafe(24),
              "APP_ENCRYPTION_KEY": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              "APP_BLIND_INDEX_KEY": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              "JWT_SIGNING_KEY": secrets.token_urlsafe(48),
              "SMTP_HOST": "smtp.example.invalid", "SMTP_FROM": "no-reply@example.invalid",
              "PUBLIC_APP_URL": "https://app.example.invalid",
              "IMAGE_OWNER": "ci-owner", "IMAGE_TAG": "ci",
              "TURNSTILE_SITE_KEY": "1x00000000000000000000AA",
              "TURNSTILE_SECRET_KEY": "1x0000000000000000000000000000000AA",
          }
          for name, value in values.items():
              print(f"{name}={value}")
          PY
          docker compose --env-file /tmp/prod.env -f docker-compose.prod.yml config --quiet
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Python dependency audit (pip-audit, OSV/PyPA advisories)
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e './backend[dev,seed]'
          scripts/ci/annotate.sh "pip-audit" python -m pip_audit --skip-editable --progress-spinner off
      - name: Frontend dependency audit
        run: |
          cd frontend && npm ci --ignore-scripts
          ../scripts/ci/annotate.sh "npm audit" npm audit --audit-level=high
      - name: Repository scan (dependencies, secrets, IaC misconfiguration)
        run: |
          set -euo pipefail
          V=0.75.0
          cd /tmp
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_checksums.txt"
          grep " trivy_${V}_Linux-64bit.tar.gz$" "trivy_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${V}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          cd "$GITHUB_WORKSPACE"
          scripts/ci/annotate.sh "Trivy report" trivy fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 0 --skip-dirs frontend/node_modules .
          scripts/ci/annotate.sh "Trivy fs CRITICAL" \
            trivy fs --quiet --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs frontend/node_modules .
          # Misconfiguration findings are reported for review, not gating (dev compose is intentionally permissive).
          for target in deploy/helm/insurance-platform infra; do
            scripts/ci/annotate.sh "Trivy config report" trivy config --quiet --severity HIGH,CRITICAL --exit-code 0 "$target"
          done
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.22.1}
      - name: Install kubeconform (pinned release, checksum verified)
        run: |
          set -euo pipefail
          V=v0.8.0
          cd /tmp
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${V}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${V}/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz$" CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Lint, render and schema-validate the chart (default and production values)
        run: |
          set -euo pipefail
          chart=deploy/helm/insurance-platform
          # Monitoring files are copies so the chart is self-contained; they must not drift.
          cmp infra/monitoring/alerts.yaml "$chart/files/alerts.yaml"
          cmp infra/monitoring/grafana/insurance-platform.json "$chart/files/grafana-dashboard.json"
          helm lint --strict "$chart"
          helm lint --strict "$chart" -f "$chart/values-production.yaml"
          for values in values.yaml values-production.yaml; do
            helm template ip "$chart" -f "$chart/$values" --namespace insurance > "/tmp/render-$values"
            kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 "/tmp/render-$values"
          done
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/render-values-production.yaml
          grep -q 'kind: PrometheusRule' /tmp/render-values-production.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/render-values-production.yaml
  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e './backend[dev,seed]'
      - name: Generate ephemeral CI secrets and start PostgreSQL + transaction pooler
        run: |
          python scripts/bootstrap_env.py
          python - <<'PY'
          import secrets
          from pathlib import Path
          path = Path('.env')
          text = path.read_text()
          text = text.replace('DEMO_STAFF_PASSWORD=', 'DEMO_STAFF_PASSWORD=' + secrets.token_urlsafe(24))
          path.write_text(text)
          PY
          docker compose config --quiet
          docker compose up -d --wait postgres pgbouncer redis
      - name: Apply the real PostgreSQL migrations
        run: docker compose run --rm migrate
      - name: Prove RLS through direct PostgreSQL AND PgBouncer transaction pooling
        run: |
          set -a
          . ./.env
          set +a
          export TEST_DATABASE_ADMIN_URL="postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export TEST_DIRECT_DATABASE_URL="postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export TEST_PGBOUNCER_DATABASE_URL="postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@127.0.0.1:6432/${POSTGRES_DB}"
          cd backend
          set +e
          timeout 1500 python -m pytest -m integration -v --timeout=240 --timeout-method=thread --durations=15 > /tmp/insurance-integration.log 2>&1
          code=$?
          set -e
          cat /tmp/insurance-integration.log
          if [ "$code" -ne 0 ]; then
            # Surface concise failure lines in check-run annotations even when
            # GitHub's separate log-archive host is unreachable to reviewers.
            python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/insurance-integration.log').read_text(errors='replace').splitlines()
          summary = [line for line in lines if line.startswith(('FAILED ', 'ERROR '))]
          errors = [line for line in lines if line.startswith('E   ')]
          import re
          # The log archive is not always reachable from restricted networks.
          # Emit traceback excerpts FIRST (Actions can cap step annotations).
          parts = re.split(r'(?m)^_{3,} (test_.*) _{3,}$', '\n'.join(lines))
          for name, trace in list(zip(parts[1::2], parts[2::2]))[:8]:
              tail = trace[-2200:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Trace {name[:70]}::{tail}')
          text = '\n'.join(lines)
          running = [line for line in lines if '::test_' in line][-3:]
          print('::error title=Last tests::' + '%0A'.join(line.replace('%', '%25') for line in running))
          marker = text.find('+++ Timeout +++')
          chunk = text[marker:marker + 3500] if marker >= 0 else text[-3000:]
          chunk = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Integration log excerpt::{chunk}')
          for line in (summary + errors)[:4]:
              escaped = line[:1200].replace('%', '%25').replace('\r', '%0D')
              print(f'::error title=PostgreSQL integration failure::{escaped}')
          PY
          fi
          exit "$code"
      - name: Seed 5,000 synthetic tickets (twice to check idempotence)
        run: |
          docker compose run --rm seed
          docker compose run --rm seed
          set -a
          . ./.env
          set +a
          python - <<'PY'
          import os
          import psycopg
          url = f"postgresql://postgres:{os.environ['POSTGRES_PASSWORD']}@127.0.0.1:5432/{os.environ['POSTGRES_DB']}"
          with psycopg.connect(url) as conn:
              assert conn.execute('SELECT count(*) FROM complaints').fetchone()[0] == 5000
              assert conn.execute('SELECT count(*) FROM permissions').fetchone()[0] >= 34
          PY
      - name: Load smoke (k6) against the real API, PgBouncer and RLS
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          # Non-production only: the multiplier relaxes per-IP windows for a single load generator.
          export RATE_LIMIT_MULTIPLIER=100
          scripts/ci/annotate.sh "compose up api" docker compose up -d api || {
            scripts/ci/annotate.sh "compose state" sh -c 'docker compose ps -a; docker compose logs --no-color --tail=40; exit 1'
          }
          ready=0
          for attempt in $(seq 1 60); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            scripts/ci/annotate.sh "API not ready" sh -c 'docker compose logs --no-color --tail=80 api; exit 1'
          fi
          docker compose run --rm -T --no-deps \
            -e "DATABASE_ADMIN_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
            api python -m app.scripts.loadtest_sessions --customers 100 --staff 10 \
            > /tmp/sessions.json 2> /tmp/sessions.err || {
              scripts/ci/annotate.sh "load-test sessions" sh -c 'cat /tmp/sessions.err; head -c 500 /tmp/sessions.json; exit 1'
            }
          scripts/ci/annotate.sh "load-test sessions output" python -c "import json; d = json.load(open('/tmp/sessions.json')); print({k: len(v) for k, v in d.items()}); assert d['customers'] and d['tracking'] and d['staff']"
          docker run --rm --network insurance-platform_default \
            -v "$PWD/loadtest/k6:/scripts:ro" -v /tmp/sessions.json:/tmp/sessions.json:ro \
            -e BASE_URL=http://api:8000 -e SESSIONS=/tmp/sessions.json -e PROFILE=smoke \
            grafana/k6:2.3.0 run --quiet /scripts/platform.js > /tmp/k6.log 2>&1 || {
              cat /tmp/k6.log
              scripts/ci/annotate.sh "k6 smoke" sh -c 'grep -E "✗|thresholds|http_req_duration|unexpected|checks|ERRO|level=error" /tmp/k6.log | tail -60; exit 1'
            }
          cat /tmp/k6.log
      - name: Backup and restore drill (checksum, revision, RLS still enforced)
        run: |
          set -euo pipefail
          docker compose cp scripts/backup postgres:/tmp/backup
          docker compose exec -T -e BACKUP_DIR=/tmp/backups -e MIN_COMPLAINTS=5000 postgres sh -ec '
            export PGUSER="$POSTGRES_USER" PGDATABASE="$POSTGRES_DB"
            EXPECTED_REVISION=$(psql -Atc "SELECT version_num FROM alembic_version")
            export EXPECTED_REVISION
            dump=$(sh /tmp/backup/pg_backup.sh)
            sh /tmp/backup/pg_restore_drill.sh "$dump"'
      - if: always()
        run: |
          docker compose logs --no-color --tail=200 api || true
          docker compose down -v
