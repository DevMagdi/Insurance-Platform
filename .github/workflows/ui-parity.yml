name: UI parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Run frontend tests
        run: cd frontend && npm test
      - name: Build production frontend
        run: cd frontend && npm run build

  e2e:
    name: Playwright E2E with migrated PostgreSQL and seeded CRM data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: insurance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insurance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev,seed]'
      - name: Generate per-run credentials and initialize the restricted database roles
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/bootstrap_env.py
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('.env')
          lines = path.read_text().splitlines()
          values = {
              'POSTGRES_PASSWORD': os.environ['POSTGRES_PASSWORD'],
              'DEMO_STAFF_PASSWORD': 'ui-parity-' + os.urandom(18).hex(),
          }
          output = []
          for line in lines:
              replacement = next((value for key, value in values.items() if line.startswith(key + '=')), None)
              output.append(line.split('=', 1)[0] + '=' + replacement if replacement is not None else line)
          path.write_text('\n'.join(output) + '\n')
          PY
          set -a
          . ./.env
          set +a
          export DATABASE_ADMIN_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          cd backend
          python -m app.scripts.prepare_ci_database
      - name: Apply migrations and seed synthetic manager, sellers, leads, and converted client
        run: |
          set -a
          . ./.env
          set +a
          export DATABASE_ADMIN_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          cd backend
          python -m alembic upgrade head
          python -m app.scripts.seed_ui_parity
      - name: Install frontend dependencies and Chromium for CI
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the backend against the migrated PostgreSQL service
        run: |
          set -a
          . ./.env
          set +a
          export DATABASE_URL="postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export REDIS_URL=redis://127.0.0.1:6379/0
          export ENVIRONMENT=development
          export COOKIE_SECURE=false
          cd backend
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/ui-parity-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready >/dev/null; then
              echo 'Backend is ready against the migrated PostgreSQL service.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ui-parity-api.log
          exit 1
      - name: Run the Playwright E2E suite (both mobile and desktop projects)
        run: |
          cd frontend
          npx playwright test --list
          npm run test:e2e -- --reporter=github,html
      - name: Collect backend log for the E2E artifact
        if: always()
        run: cp /tmp/ui-parity-api.log frontend/ui-parity-api.log 2>/dev/null || true
      - name: Upload Playwright screenshots, traces, and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-parity-playwright-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/ui-parity-api.log
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Full backend pytest suite (unit and PostgreSQL integration)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: insurance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insurance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev,seed]'
      - name: Generate per-run credentials and prepare PostgreSQL roles
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/bootstrap_env.py
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('.env')
          lines = path.read_text().splitlines()
          values = {
              'POSTGRES_PASSWORD': os.environ['POSTGRES_PASSWORD'],
              'DEMO_STAFF_PASSWORD': 'backend-ci-' + os.urandom(18).hex(),
          }
          output = []
          for line in lines:
              replacement = next((value for key, value in values.items() if line.startswith(key + '=')), None)
              output.append(line.split('=', 1)[0] + '=' + replacement if replacement is not None else line)
          path.write_text('\n'.join(output) + '\n')
          PY
          set -a
          . ./.env
          set +a
          export DATABASE_ADMIN_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          cd backend
          python -m app.scripts.prepare_ci_database
      - name: Migrate PostgreSQL and start transaction-pooling PgBouncer
        run: |
          set -a
          . ./.env
          set +a
          export DATABASE_ADMIN_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          cd backend
          python -m alembic upgrade head
          docker run --detach --name ci-pgbouncer --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME="${POSTGRES_DB}" \
            -e DB_USER=app_runtime -e DB_PASSWORD="${APP_DB_PASSWORD}" \
            -e AUTH_TYPE=scram-sha-256 -e POOL_MODE=transaction \
            -e LISTEN_PORT=6432 edoburu/pgbouncer:v1.24.1-p1
          python - <<'PY'
          import os
          import time
          import psycopg
          url = f"postgresql://app_runtime:{os.environ['APP_DB_PASSWORD']}@127.0.0.1:6432/{os.environ['POSTGRES_DB']}"
          for _ in range(60):
              try:
                  with psycopg.connect(url, connect_timeout=2) as connection:
                      connection.execute('SELECT 1')
                  print('PgBouncer is ready.')
                  break
              except psycopg.OperationalError:
                  time.sleep(2)
          else:
              raise RuntimeError('PgBouncer did not become ready')
          PY
      - name: Run all backend tests, including PostgreSQL integration tests
        run: |
          set -a
          . ./.env
          set +a
          export TEST_DATABASE_ADMIN_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export TEST_DIRECT_DATABASE_URL="postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export TEST_PGBOUNCER_DATABASE_URL="postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@127.0.0.1:6432/${POSTGRES_DB}"
          cd backend
          python -m pytest -v --durations=15 --junitxml=/tmp/ui-parity-backend-junit.xml
      - name: Upload backend test report and PostgreSQL service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-parity-backend-${{ github.run_id }}
          path: /tmp/ui-parity-backend-junit.xml
          if-no-files-found: ignore
          retention-days: 14
