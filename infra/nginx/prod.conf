# Same-origin edge for the built SPA: static assets + /api proxy (HTTP and WebSocket).
# TLS terminates in front of this container (load balancer / ingress / Traefik).
#
# Defence in depth: coarse per-IP limits here absorb floods cheaply; the API's
# Redis sliding windows (per IP / user / endpoint / API key) are authoritative.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Trust X-Forwarded-For only from private networks (the LB / ingress in front).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;
client_max_body_size 25m;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 30s;
large_client_header_buffers 4 16k;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

server {
    listen 80;
    server_name _;
    # Above typical load-balancer idle timeouts (the base nginx.conf sets 65s at http level).
    keepalive_timeout 75s;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build output is immutable (CDN-cacheable for a year); the shell
    # must always be revalidated so a deploy cannot strand deleted assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Brute-force surface: small burst, then 429 before the API is touched.
    location ~ ^/api/(auth/|guest/track) {
        limit_req zone=auth_per_ip burst=10 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/api/(customer|staff)/attachments/uploads/ {
        limit_req zone=upload_per_ip burst=10 nodelay;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Long-lived WebSocket snapshots and SSE-style streams must not be buffered.
    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn conn_per_ip 50;
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API docs and schema are not exposed by the production edge.
    location = /docs {
        return 404;
    }
    location ^~ /docs/ {
        return 404;
    }
    location = /redoc {
        return 404;
    }
    location ^~ /redoc/ {
        return 404;
    }
    location = /openapi.json {
        return 404;
    }

    # Prometheus scrapes the API directly on the private network, never via the edge.
    location = /metrics {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
