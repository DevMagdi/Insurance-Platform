# Same-origin edge for the built SPA: static assets + /api proxy (HTTP and WebSocket).
# Put a TLS terminator (load balancer, Traefik or certbot) in front of this container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server_tokens off;
client_max_body_size 25m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Hashed build output is immutable; the shell must always be revalidated so a
    # deploy cannot leave a cached index.html pointing at deleted assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Long-lived WebSocket snapshots and SSE-style streams must not be buffered.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keep the running contract/UI reachable on the app origin.
    location ~ ^/(docs(/oauth2-redirect)?|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
