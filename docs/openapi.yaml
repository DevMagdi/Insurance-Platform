openapi: 3.1.0
info:
  title: Insurance Brokerage Complaint Management
  version: 0.2.0
  description: Implemented Phase 2 and Phase 3 HTTP routes. Authenticate with an HttpOnly
    access_token cookie; /api/auth/refresh uses the HttpOnly refresh_token cookie.
    All protected writes, including refresh, need X-CSRF-Token matching the readable
    csrf_token cookie. Authorization, AccessScope and PostgreSQL RLS are enforced
    at runtime. Future routes are documented separately in openapi-roadmap.yaml.
paths:
