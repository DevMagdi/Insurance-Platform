  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived JWT; Secure, HttpOnly, SameSite=Lax, Path=/api.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Rotating JWT; Secure, HttpOnly, SameSite=Lax, Path=/api/auth.
x-websockets:
- path: /api/staff/complaints/stream
  description: Same-origin, AccessCookie, complaints.view; filtered scoped snapshots
    on connect, refresh or heartbeat.
x-event-streams:
- path: /api/customer/complaints/{complaint_id}/stream
  description: Server-Sent Events; same-origin AccessCookie for the owning customer.
    Emits snapshot/update events (status + signature only, never message bodies) and
    revalidates session, token version and ownership per poll.
