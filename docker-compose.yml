name: insurance-platform
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run make init}
      POSTGRES_USER: ${POSTGRES_USER:?run make init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run make init}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01_app_runtime.sh:/docker-entrypoint-initdb.d/01_app_runtime.sh:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:?run make init}
      DB_USER: app_runtime
      DB_PASSWORD: ${APP_DB_PASSWORD:?run make init}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '20'
      MAX_PREPARED_STATEMENTS: '100'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:6432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U app_runtime -d "$${DB_NAME}"']
      interval: 5s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.5 # Local development mailbox, not a production provider.
    ports:
      - '127.0.0.1:8025:8025'

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    # S3-compatible SeaweedFS gateway for local development.
    image: chrislusf/seaweedfs:4.48
    command: ['mini', '-s3.port=9000', '-s3.port.iceberg=0', '-s3.port.lance=0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run make init}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run make init}
    volumes:
      - object_store_data:/data
    ports:
      - '127.0.0.1:9000:9000'
  object-store-init:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      S3_ENDPOINT_URL: http://object-store:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run make init}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run make init}
      S3_BUCKET: ${S3_BUCKET:?run make init}
    depends_on:
      - object-store
    command: ['python', '-m', 'app.scripts.init_bucket']

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?run make init}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['alembic', 'upgrade', 'head']

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run make init}
      APP_BLIND_INDEX_KEY: ${APP_BLIND_INDEX_KEY:?run make init}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run make init}
      S3_BUCKET: ${S3_BUCKET:?run make init}
      S3_ENDPOINT_URL: http://object-store:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run make init}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run make init}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      ENVIRONMENT: development
      DEV_SMS_MAILBOX: 'true'
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      COOKIE_SECURE: 'true'
      DATABASE_URL: postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Load tests only; production refuses any value other than 1.
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/live", timeout=2)']
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      WORKER_DATABASE_URL: postgresql+asyncpg://app_worker:${APP_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run make init}
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: ${S3_BUCKET:?run make init}
      S3_ENDPOINT_URL: http://object-store:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run make init}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run make init}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      DEV_SMS_MAILBOX: 'true'
      ENVIRONMENT: development
    command: ['arq', 'app.worker.WorkerSettings']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  seed:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    profiles: ['tools']
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['python', '-m', 'app.scripts.seed']
    depends_on:
      migrate:
        condition: service_completed_successfully

  partitions:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    profiles: ['tools']
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['python', '-m', 'app.scripts.partitions']
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  object_store_data:
    # Set this to an existing local volume name when upgrading without moving data.
    name: ${OBJECT_STORE_VOLUME:-insurance-platform-object-store-data}
