name: insurance-platform
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run make init}
      POSTGRES_USER: ${POSTGRES_USER:?run make init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run make init}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?run make init}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01_app_roles.sh:/docker-entrypoint-initdb.d/01_app_roles.sh:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:?run make init}
      DB_USER: app_runtime
      DB_PASSWORD: ${APP_DB_PASSWORD:?run make init}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '20'
      MAX_PREPARED_STATEMENTS: '100'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:6432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U app_runtime -d "$${DB_NAME}"']
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?run make init}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['alembic', 'upgrade', 'head']

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run make init}
      APP_BLIND_INDEX_KEY: ${APP_BLIND_INDEX_KEY:?run make init}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run make init}
      JWT_KEY_ID: ${JWT_KEY_ID:-active}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:-}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:-}
      JWT_PREVIOUS_PUBLIC_KEYS: ${JWT_PREVIOUS_PUBLIC_KEYS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      ENVIRONMENT: development
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      COOKIE_SECURE: 'true'
      DATABASE_URL: postgresql+asyncpg://app_runtime:${APP_DB_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Load tests only; production refuses any value other than 1.
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
      # The development host may expose many CPUs while Docker has a small
      # memory limit; cap worker processes to avoid an OOM/reverse-proxy 502.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/ready", timeout=2)']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      WORKER_DATABASE_URL: postgresql+asyncpg://app_worker:${APP_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run make init}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      ENVIRONMENT: development
    command: ['arq', 'app.worker.WorkerSettings']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  bootstrap_admin:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    # Opt-in only: `docker compose up` must never create staff accounts. It
    # prompts for the name, e-mail and password; set BOOTSTRAP_ADMIN_* and pass
    # --non-interactive for automation. Creates one admin and no demo data.
    profiles: ['tools']
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ['python', '-m', 'app.scripts.bootstrap_admin']
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    profiles: ['tools']
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['python', '-m', 'app.scripts.seed']
    depends_on:
      migrate:
        condition: service_completed_successfully

  partitions:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    profiles: ['tools']
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['python', '-m', 'app.scripts.partitions']
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

# PostgreSQL and Redis only: all outgoing email uses the configured real SMTP provider;
# private binaries live encrypted inside PostgreSQL, so no object store is started.
volumes:
  postgres_data:
  redis_data:
